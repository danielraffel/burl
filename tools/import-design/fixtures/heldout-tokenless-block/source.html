<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dispatch Board</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #11151b; color: #e7edf5; }
    body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
    .shell { position: relative; width: 960px; height: 640px; background: #11151b; overflow: hidden; }
    .rail { display: block; position: absolute; inset: 0 auto 0 0; width: 244px; padding: 18px; background: #181e27; overflow-y: auto; }
    .brand { display: block; margin: 0 0 18px; color: #e7edf5; font-size: 18px; font-weight: 650; }
    .nav { display: block; margin: 0; padding: 0; }
    .nav-item { display: block; position: relative; margin: 4px 0; padding: 9px 12px 9px 34px; border-radius: 8px; color: #aeb8c6; background: #181e27; }
    .nav-item.active { color: #e7edf5; background: #263142; }
    .dot { display: inline-block; position: absolute; left: 13px; top: 14px; width: 8px; height: 8px; border-radius: 4px; background: #4bd28b; }
    .main { display: block; position: absolute; inset: 0 0 0 244px; padding: 0 24px 24px; overflow-y: auto; background: #11151b; }
    .toolbar { display: block; position: sticky; top: 0; z-index: 2; height: 58px; padding: 18px 0 12px; color: #e7edf5; background: #11151b; border-bottom: 1px solid #303947; }
    .toolbar-note { display: inline-block; float: right; color: #aeb8c6; }
    .card { display: block; position: relative; margin: 18px 0; padding: 16px; min-height: 94px; color: #e7edf5; background: #181e27; border: 1px solid #303947; border-radius: 12px; overflow: hidden; }
    .card-title { display: block; margin-bottom: 7px; font-size: 15px; font-weight: 650; }
    .card-copy { display: block; color: #aeb8c6; }
    .badge { display: inline-block; margin: 11px 6px 0 0; padding: 3px 8px; color: #11151b; background: #4bd28b; border-radius: 10px; }
    .pin { position: absolute; right: 14px; top: 14px; width: 10px; height: 10px; background: #f5b84b; transform: rotate(45deg); }
    .composer { display: block; position: sticky; bottom: 0; padding: 13px; color: #aeb8c6; background: #181e27; border: 1px solid #303947; border-radius: 12px; }
  </style>
</head>
<body>
  <main class="shell" aria-label="Dispatch board">
    <aside class="rail"><h1 class="brand">Dispatch</h1><nav class="nav">
      <div class="nav-item active"><span class="dot"></span>Current queue</div>
      <div class="nav-item">History</div><div class="nav-item">Settings</div>
    </nav></aside>
    <section class="main"><header class="toolbar">Today <span class="toolbar-note">3 open</span></header>
      <article class="card"><span class="pin"></span><strong class="card-title">Prepare release notes</strong><span class="card-copy">Review the native build and attach evidence.</span><span class="badge">Ready</span></article>
      <article class="card"><strong class="card-title">Audit keyboard routes</strong><span class="card-copy">Confirm focus, selection, clipboard, and IME.</span><span class="badge">Ready</span></article>
      <div class="composer" role="textbox" aria-label="Add a task">Add a task…</div>
    </section>
  </main>
</body>
</html>
